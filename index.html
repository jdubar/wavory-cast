<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wavory</title>
    <link rel="stylesheet" href="receiver.css" />
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body class="idle">
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>

    <header class="top">
      <img class="wordmark" src="wordmark.svg" alt="Wavory" />
    </header>

    <main class="stage">
      <section class="ready">
        <img class="ready-mark" src="mark.svg" alt="" />
        <p>Pick a station in Wavory on your phone.</p>
      </section>

      <section class="playing">
        <div class="cover">
          <img id="cover" alt="" />
          <img class="cover-fallback" src="mark.svg" alt="" />
        </div>
        <div class="info">
          <p class="eyebrow" id="station"></p>
          <h1 id="title"></h1>
          <p class="artist" id="artist"></p>
          <p class="album" id="album"></p>
          <div class="progress">
            <div class="track"><div class="fill" id="fill"></div></div>
            <div class="times">
              <span id="elapsed">0:00</span>
              <span class="state" id="state"></span>
              <span id="duration">0:00</span>
            </div>
          </div>
          <div class="controls">
            <button class="btn thumb" id="thumbDown" aria-label="Thumbs down">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z" /></svg>
            </button>
            <button class="btn play" id="playPause" aria-label="Pause">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
            </button>
            <button class="btn" id="skip" aria-label="Skip song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg>
            </button>
            <button class="btn thumb" id="thumbUp" aria-label="Thumbs up">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" /></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <audio id="audio"></audio>
    <script src="receiver.js"></script>
  </body>
</html>
